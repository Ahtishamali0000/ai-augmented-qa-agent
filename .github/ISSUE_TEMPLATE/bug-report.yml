name: Bug Report
description: Report a bug for QA triage, regression testing, and automation planning
title: "[Bug]: "
labels:
  - bug
  - qa-triage
body:
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      placeholder: Checkout button does not continue to payment
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: CF UK, UAT1 US, production, mobile Chrome
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, video, logs, affected URL, test data
